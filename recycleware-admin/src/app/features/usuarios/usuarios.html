<div class="usuarios-wrapper">
  <div class="usuarios-header">
    <h2>Gestión de Usuarios</h2>
    <button class="btn-create">Crear Usuario</button>
  </div>
  <table class="usuarios-table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Nombre</th>
        <th>DNI</th>
        <th>Rol</th>
        <th>Estado</th>
        <th>Opciones</th>
      </tr>
    </thead>
    <tbody>
      @for (user of usuarios; track user.id) {
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.nombre }}</td>
          <td>{{ user.dni }}</td>
          <td>{{ user.rol }}</td>
          <td>{{ user.estado }}</td>
          <td>
            <div class="options-cell">
              <button class="btn-edit" title="Editar"><i class="bi bi-pencil"></i></button>
              <button class="btn-delete" title="Borrar" (click)="eliminarUsuario(user.id)"><i class="bi bi-trash"></i></button>
            </div>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" style="text-align: center;">No hay usuarios registrados.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
